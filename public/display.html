<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Display</title>
    <link rel="stylesheet" href="/css/app.css?v=31" />
  </head>
  <body class="display">
    <div class="display-timer hidden" data-display-timer aria-hidden="true">
      <p class="display-timer-value" data-display-timer-value>00</p>
    </div>

    <main class="display-question hidden" data-quiz-overlay>
      <section class="display-category-picker hidden" data-category-picker>
        <div class="display-category-grid" data-category-grid></div>
      </section>

      <section class="display-category-chosen hidden" data-category-chosen>
        <p class="display-chosen-kicker">Category chosen</p>
        <p class="display-chosen-name" data-chosen-name></p>
      </section>

      <div class="display-question-main hidden" data-question-panel>
        <div class="question-lower-third">
          <p class="question-round" data-round-label></p>
          <p class="question-body hidden" data-question></p>
          <ul class="question-clues hidden" data-clues></ul>
          <ul class="question-options hidden" data-options></ul>
        </div>
      </div>
    </main>

    <section class="display-money-celebration hidden" data-money-celebration>
      <div class="money-rain" data-money-rain aria-hidden="true"></div>
      <div class="money-celebration-content">
        <p class="money-celebration-kicker">Congratulations!</p>
        <div class="money-celebration-total-stage">
          <p class="money-celebration-total" data-celebration-total>GHS 0.00</p>
        </div>
        <p class="money-celebration-label">Total earned</p>
      </div>
    </section>

    <div class="display-money-earned hidden" data-money-earned-panel>
      <p class="display-money-earned-label">Total earned</p>
      <p class="display-money-earned-total" data-earned>GHS 0.00</p>
    </div>

    <aside class="display-money-ladder hidden" data-ladder-panel>
      <ul class="money-ladder-list" data-ladder></ul>
    </aside>

    <aside class="display-panel">
      <section class="display-slots" data-slots></section>
    </aside>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/dev-reload.js"></script>
    <script src="/js/bells.js"></script>
    <script src="/js/money-animate.js?v=3"></script>
    <script src="/js/display.js?v=28"></script>
  </body>
</html>
