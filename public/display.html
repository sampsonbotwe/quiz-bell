<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quiz Bell Display</title>
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body class="display">
    <aside class="display-panel">
      <header class="display-header">
        <p class="display-kicker">Live</p>
        <h1>Bell Order</h1>
      </header>
      <section class="display-slots">
        <article class="slot" data-rank>
          <div class="slot-bar">
            <span class="slot-place">1</span>
            <span class="slot-name" data-name>Waiting</span>
          </div>
          <p class="slot-time" data-time>—</p>
        </article>
        <article class="slot" data-rank>
          <div class="slot-bar">
            <span class="slot-place">2</span>
            <span class="slot-name" data-name>Waiting</span>
          </div>
          <p class="slot-time" data-time>—</p>
        </article>
        <article class="slot" data-rank>
          <div class="slot-bar">
            <span class="slot-place">3</span>
            <span class="slot-name" data-name>Waiting</span>
          </div>
          <p class="slot-time" data-time>—</p>
        </article>
      </section>
    </aside>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/display.js"></script>
  </body>
</html>
