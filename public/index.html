<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quiz Bell</title>
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body class="home">
    <main class="wrap">
      <p class="kicker">Local quiz night</p>
      <h1>Quiz Bell</h1>
      <p class="lede">
        Open each team page on a phone, the admin page on the host laptop,
        and the display page on the LED machine. Everyone on this network can
        use the host IP.
      </p>
      <section class="grid">
        <a class="card dunamis" data-href="dunamis">
          <strong>Dunamis</strong>
          <span data-link="dunamis"></span>
        </a>
        <a class="card zoe" data-href="zoe">
          <strong>Zoe</strong>
          <span data-link="zoe"></span>
        </a>
        <a class="card pneuma" data-href="pneuma">
          <strong>Pneuma</strong>
          <span data-link="pneuma"></span>
        </a>
        <a class="card" data-href="admin">
          <strong>Admin</strong>
          <span data-link="admin"></span>
        </a>
        <a class="card" data-href="display">
          <strong>Display</strong>
          <span data-link="display"></span>
        </a>
        <a class="card" data-href="timer">
          <strong>Timer</strong>
          <span data-link="timer"></span>
        </a>
        <a class="card" data-href="timer-control">
          <strong>Timer Control</strong>
          <span data-link="timer-control"></span>
        </a>
        <a class="card" data-href="host">
          <strong>Quiz Host</strong>
          <span data-link="host"></span>
        </a>
      </section>
    </main>
    <script src="/js/home.js"></script>
  </body>
</html>
