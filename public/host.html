<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quiz Host</title>
    <link rel="stylesheet" href="/css/app.css?v=82" />
  </head>
  <body class="host-page">
    <div class="control-top-bar">
      <button type="button" class="host-nav-btn host-display-toggle control-top-btn" data-toggle-display>Hide display</button>
      <button type="button" class="host-secondary control-top-btn control-top-btn--reset" data-reset-round>Reset round</button>
      <button type="button" class="control-logout" data-control-logout>Sign out</button>
    </div>
    <main class="wrap host-wrap">
      <div class="host-header">
        <div>
          <p class="kicker">Host control</p>
          <h1>Quiz Host</h1>
        </div>
      </div>

      <div class="host-round-bar">
        <nav class="round-tabs" data-round-tabs></nav>
        <div class="host-round-bar-actions" data-round-results-panel>
          <button type="button" class="host-nav-btn host-nav-primary hidden" data-show-round-results>
            Show total scores
          </button>
          <button type="button" class="host-nav-btn host-nav-primary hidden" data-continue-round>
            Continue to next round
          </button>
        </div>
      </div>

      <section class="host-panel hidden" data-set-panel>
        <p class="host-label" data-set-panel-label>Set</p>
        <div class="pill-row" data-set-tabs></div>
      </section>

      <section class="host-panel category-panel hidden" data-category-panel>
        <p class="host-label">Category</p>
        <div class="category-grid" data-category-grid></div>
      </section>

      <section class="host-panel round4-only hidden" data-riddle-panel>
        <p class="host-label">Clues</p>
        <ul class="clue-list" data-clue-list></ul>
      </section>

      <section class="host-panel question-panel hidden" data-question-panel>
        <div class="host-sub-nav hidden" data-sub-nav>
          <div class="pill-row" data-sub-tabs>
            <button type="button" class="pill-btn" data-part="main">Main</button>
            <button type="button" class="pill-btn" data-part="sub1">Sub 1</button>
            <button type="button" class="pill-btn" data-part="sub2">Sub 2</button>
          </div>
        </div>
        <div class="host-block-status hidden" data-block-status aria-label="Question status"></div>
        <div class="question-card" data-question-card>
          <p class="question-text" data-question-text></p>
          <ul class="option-list hidden" data-option-list></ul>
          <button type="button" class="host-lifeline round5-lifeline hidden" data-round5-lifeline>
            50/50 — Drop two answers
          </button>
          <div class="pill-row round5-actions hidden" data-round5-actions>
            <button type="button" class="host-correct" data-mark-correct>Correct</button>
            <button type="button" class="host-wrong" data-mark-wrong>Wrong</button>
          </div>
          <button type="button" class="host-secondary round5-reset hidden" data-round5-reset>Restart money round</button>
          <div class="answer-box">
            <span class="host-label">Answer</span>
            <p class="answer-text" data-answer-text></p>
          </div>
        </div>
      </section>

      <div class="host-nav-riddle hidden" data-riddle-nav>
        <button type="button" class="host-nav-btn host-nav-riddle-btn" data-riddle-prev aria-label="Previous riddle">
          ← Previous
        </button>
        <p class="host-nav-progress" data-riddle-nav-progress>Riddle 1 of 5</p>
        <button type="button" class="host-nav-btn host-nav-riddle-btn" data-riddle-next aria-label="Next riddle">
          Next →
        </button>
      </div>

      <div class="host-nav">
        <div class="host-nav-emergency">
          <button type="button" class="host-nav-btn host-nav-btn--small" data-prev aria-label="Previous question">←</button>
          <button type="button" class="host-nav-btn host-nav-btn--small" data-next aria-label="Next question">→</button>
        </div>
        <div class="host-nav-main">
          <p class="host-nav-progress" data-nav-progress>Select a category</p>
          <div class="host-nav-actions">
            <button type="button" class="host-nav-btn host-nav-primary hidden" data-mark-block-done>Question done</button>
            <button type="button" class="host-nav-btn host-secondary hidden" data-mark-category-done>Category done</button>
          </div>
        </div>
      </div>

    </main>

    <div class="host-confirm hidden" data-round5-wrong-dialog aria-hidden="true">
      <div class="host-confirm-backdrop" data-round5-wrong-cancel></div>
      <div class="host-confirm-panel" role="dialog" aria-modal="true" aria-labelledby="round5-wrong-confirm-title">
        <p class="host-confirm-kicker">Money Round</p>
        <h2 class="host-confirm-title" id="round5-wrong-confirm-title">Mark as wrong?</h2>
        <p class="host-confirm-text">
          This will end the money round and close the game on the display. The team will see their total winnings celebration.
        </p>
        <div class="host-confirm-actions">
          <button type="button" class="host-secondary" data-round5-wrong-cancel>Go back</button>
          <button type="button" class="host-wrong" data-round5-wrong-confirm>Yes, end round</button>
        </div>
      </div>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/dev-reload.js"></script>
    <script src="/js/money-animate.js"></script>
    <script src="/js/host.js?v=8"></script>
    <script src="/js/control-auth.js?v=1"></script>
  </body>
</html>
