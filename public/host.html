<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quiz Host</title>
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body class="host-page">
    <main class="wrap host-wrap">
      <div class="host-header">
        <div>
          <p class="kicker">Host control</p>
          <h1>Quiz Host</h1>
        </div>
        <div class="host-progress" data-progress>Round 1</div>
      </div>

      <div class="host-round-bar">
        <nav class="round-tabs" data-round-tabs></nav>
        <button type="button" class="host-nav-btn host-display-toggle" data-toggle-display>Hide display</button>
      </div>

      <section class="host-panel round1-only hidden" data-set-panel>
        <p class="host-label">Set</p>
        <div class="pill-row" data-set-tabs></div>
      </section>

      <section class="host-panel category-panel hidden" data-category-panel>
        <p class="host-label">Category</p>
        <div class="category-grid" data-category-grid></div>
      </section>

      <section class="host-panel round4-only hidden" data-riddle-panel>
        <p class="host-label">Clues</p>
        <div class="pill-row">
          <button type="button" class="host-action" data-reveal-clue>Reveal next clue</button>
          <button type="button" class="host-secondary" data-hide-clues>Hide clues</button>
        </div>
        <ul class="clue-list" data-clue-list></ul>
      </section>

      <section class="host-panel round5-only hidden" data-money-panel>
        <p class="host-label">Money ladder</p>
        <ul class="money-ladder" data-money-ladder></ul>
        <p class="money-earned" data-money-earned>Total earned: 0 GHS</p>
        <div class="pill-row round5-actions hidden" data-round5-actions>
          <button type="button" class="host-correct" data-mark-correct>Correct</button>
          <button type="button" class="host-wrong" data-mark-wrong>Wrong</button>
        </div>
        <button type="button" class="host-secondary hidden" data-round5-reset>Restart money round</button>
      </section>

      <section class="host-panel question-panel hidden" data-question-panel>
        <div class="host-sub-nav hidden" data-sub-nav>
          <div class="pill-row" data-sub-tabs>
            <button type="button" class="pill-btn" data-part="main">Main</button>
            <button type="button" class="pill-btn" data-part="sub1">Sub 1</button>
            <button type="button" class="pill-btn" data-part="sub2">Sub 2</button>
          </div>
        </div>
        <div class="question-card">
          <p class="question-text" data-question-text></p>
          <ul class="option-list hidden" data-option-list></ul>
          <div class="answer-box">
            <span class="host-label">Answer</span>
            <p class="answer-text" data-answer-text></p>
          </div>
        </div>
      </section>

      <section class="host-panel round3-note hidden" data-round3-note>
        <p class="lede">Use <strong>Timer Control</strong> for the 60-second countdown. Advance questions below as the team answers.</p>
      </section>

      <div class="host-nav">
        <button type="button" class="host-nav-btn" data-prev>← Previous</button>
        <p class="host-nav-progress" data-nav-progress>Select a category</p>
        <button type="button" class="host-nav-btn host-nav-primary" data-next>Next →</button>
      </div>
    </main>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/host.js"></script>
  </body>
</html>
